_BASE_: /scratch/gautschi/sahinm/LangevinMonteCarlo/mri_reconstruction/PnP-MonteCarlo/configs/radial_mri/base_unet_noise.yaml

exp_name: acc8/cost2/sgd/gamma5e_6

model:
  name: PMCRED
  estimator:
    name: PAGE
    batch_size: 4
    mini_batch_size: 2
    beta: 0.8
    std_noise_grad: 10.0
  forward_model:
    num_lines: 32
    #num_coils: 96
  score_fn:
    network_mode: sigma
    use_embed: True
  coeff:
    name: GeometricAnnealingCoeffModule
    decay_rate: 0.99
    min_sigma: 1.0e-2
  gamma: 5.0e-6
  alpha: 1.0e+4
  sigma: 348
  mem_logger:
    name: CUDAMemoryLogger
    interval: 5
    enabled: True

inference:
  is_wandb_logger: False
  sample_args:
    tmax: 5000
    initialization: rand
  inference_args:
    max_num_batches: 10
    n_samples: 1

callbacks:
  scalarcallback:
    name: LocalScalarCallbackModule
    vis_freq: 5
  imagecallback:
    name: LocalGrayImageCallbackModule